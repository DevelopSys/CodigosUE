<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./index.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>Document</title>
  </head>
  <body>
    <div class="container-flex m-4">
      <h1>App usuarios JS</h1>
      <p>Este formulario sirve para poder agregar y gestionar nodos</p>
      <div class="m-4">
        <input
          class="form-control mb-2"
          id="inputNombre"
          placeholder="introduce nombre"
        />
        <input
          class="form-control mb-2"
          id="inputMail"
          placeholder="introduce mail"
        />
        <input
          class="form-control mb-2"
          id="inputEdad"
          placeholder="introduce edad"
          type="number"
        />
        <select class="form-control mb-4" id="selectCurso">
          <option value="1">DAM</option>
          <option value="2">DAW</option>
          <option value="3">ASIR</option>
        </select>

        <div class="d-grid gap-2">
          <button class="theme-primary btn-solid btn-styled" id="btnAgregar">
            Agregar
          </button>
          <button class="theme-danger btn-solid btn-styled" id="btnVaciar">
            Vaciar
          </button>
          <button class="theme-success btn-solid btn-styled" id="btnConsultar">
            Consultar
          </button>
        </div>
      </div>
      <ul class="list-group" id="listaUsuarios"></ul>
    </div>
    <script src="./usuario.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
